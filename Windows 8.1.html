<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Mini SketchUp 3D</title>
<style>
  body { margin: 0; overflow: hidden; font-family: sans-serif; }
  #canvas-container { width: 100vw; height: 100vh; }
  .alert {
    position: absolute;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    background: #ffdddd;
    color: #900;
    border: 1px solid #900;
    padding: 10px 20px;
    border-radius: 5px;
    display: none;
    font-weight: bold;
  }
  .alert.show { display: block; }
</style>
</head>
<body>

<div id="canvas-container"></div>
<div id="alertBox" class="alert">❌ Algo deu errado!</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r152/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.152.2/examples/js/controls/OrbitControls.js"></script>
<script>
  // --- Setup básico do Three.js ---
  const container = document.getElementById('canvas-container');
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0xf0f0f0);

  const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
  camera.position.set(5, 5, 5);

  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  container.appendChild(renderer.domElement);

  const controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.update();

  // --- Luz ---
  const light = new THREE.DirectionalLight(0xffffff, 1);
  light.position.set(10, 10, 10);
  scene.add(light);
  scene.add(new THREE.AmbientLight(0x404040));

  // --- Chão ---
  const planeGeometry = new THREE.PlaneGeometry(20, 20);
  const planeMaterial = new THREE.MeshStandardMaterial({ color: 0xdddddd });
  const plane = new THREE.Mesh(planeGeometry, planeMaterial);
  plane.rotation.x = -Math.PI / 2;
  scene.add(plane);

  // --- Função para criar cubos (simula a criação de objetos) ---
  function createCube(x, y, z) {
    const geometry = new THREE.BoxGeometry();
    const material = new THREE.MeshStandardMaterial({ color: Math.random() * 0xffffff });
    const cube = new THREE.Mesh(geometry, material);
    cube.position.set(x, y, z);
    scene.add(cube);
  }

  // --- Render loop ---
  function animate() {
    requestAnimationFrame(animate);
    renderer.render(scene, camera);
  }
  animate();

  // --- Função de alerta personalizado ❌ ---
  function showAlert(message) {
    const alertBox = document.getElementById('alertBox');
    alertBox.innerHTML = "❌ " + message;
    alertBox.classList.add('show');
    setTimeout(() => alertBox.classList.remove('show'), 3000);
  }

  // --- Testando criação de cubo ---
  window.addEventListener('keydown', (e) => {
    if (e.key === 'c') {
      createCube(Math.random()*4-2, 0.5, Math.random()*4-2);
    }
    if (e.key === 'a') {
      showAlert("Você apertou a tecla 'a'!");
    }
  });

  // --- Ajuste de resize ---
  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });
</script>

</body>
</html>
